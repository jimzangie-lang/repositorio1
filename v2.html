<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Angie Jiménez · Data Analyst</title>
<meta name="description" content="Angie Jiménez, Data Analyst en Bogotá. Python, Power BI, KPIs y arquitectura de datos, con experiencia en consultoría de datos e IA para cuentas globales. Trilingüe: español, inglés y portugués.">
<meta property="og:title" content="Angie Jiménez · Data Analyst">
<meta property="og:description" content="Traduzco datos técnicos complejos en recomendaciones de negocio accionables. Python, Power BI y KPIs, en español, inglés y portugués.">
<meta name="theme-color" content="#f6f5f1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* =========================================================
   PORTAFOLIO · Angie Jiménez (basado en la plantilla 04 "Mapa de habilidades")
   Un mapa interactivo conecta cada habilidad con los proyectos que la prueban.
   Para cambiar colores o fuentes, edita solo las variables de :root.
   ========================================================= */
:root{--bg:#f6f5f1;--panel:#ffffff;--tinta:#1c1c1c;--gris:#68655d;--linea:#dedbd2;--suave:#ebe9e2;--acento:#2747ff;--f:"Familjen Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif}
body{background:var(--bg);color:var(--tinta);font-family:var(--f);font-size:16px;line-height:1.5}
.wrap{max-width:1220px;margin:0 auto;padding:0 clamp(18px,4vw,48px)}

/* ---------- navegación fija ---------- */
header.top{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:16px 0;font-size:14px;background:var(--bg);box-shadow:0 0 0 100vmax var(--bg);clip-path:inset(0 -100vmax);border-bottom:1px solid transparent;transition:border-color .3s}
header.top.scrolled{border-bottom-color:var(--linea)}
header.top .id{font-weight:700;display:flex;gap:10px;align-items:center;text-decoration:none;white-space:nowrap}
header.top .id i{width:30px;height:30px;border-radius:50%;background:var(--tinta);color:var(--bg);display:grid;place-items:center;font-style:normal;font-size:12px;letter-spacing:.02em}
header.top nav{display:flex;gap:22px}
header.top nav a{text-decoration:none;color:var(--gris);white-space:nowrap}header.top nav a:hover{color:var(--tinta)}

/* ---------- inicio (hero) y mapa ---------- */
.hero{display:grid;grid-template-columns:1fr 1.25fr;gap:clamp(24px,4vw,56px);align-items:center;padding:clamp(20px,4vw,50px) 0 30px}
/* Foto: solo se muestra si el archivo existe; si no, quedan las iniciales */
.avatar{display:block;width:clamp(96px,10vw,128px);aspect-ratio:1;border-radius:50%;overflow:hidden;background:#fff;border:4px solid var(--panel);box-shadow:0 0 0 1px var(--linea);margin-bottom:18px}
.avatar:not(.ok){display:none}
/* Zoom a la cara: ajusta scale (tamaño) y transform-origin (centro horizontal y vertical) */
.avatar img,.mini img{width:100%;height:100%;object-fit:cover;transform:scale(1.8);transform-origin:55% 30%}
.mini{display:block;width:30px;height:30px;border-radius:50%;overflow:hidden;background:#fff;box-shadow:0 0 0 1px var(--linea)}
.kick{display:inline-flex;gap:8px;align-items:center;font-size:13px;font-weight:600;background:var(--panel);border:1px solid var(--linea);padding:6px 12px;border-radius:99px}
.kick::before{content:"";width:8px;height:8px;border-radius:50%;background:#20b26b}
h1{font-size:clamp(46px,5.6vw,84px);font-weight:700;letter-spacing:-.045em;line-height:.95;margin:18px 0 14px}
h1 span{color:var(--acento)}
.role{font-size:19px;color:var(--gris);font-weight:500}
.tit{font-size:clamp(18px,1.5vw,21px);margin-top:18px;max-width:520px}
.tit b{font-weight:600;color:var(--acento)}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}
.btn{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-weight:600;font-size:15px;padding:12px 20px;border-radius:99px;border:1px solid var(--tinta);transition:background .25s,color .25s,transform .25s}
.btn.pri{background:var(--tinta);color:var(--bg)}
.btn:hover{transform:translateY(-2px)}
.btn.sec:hover{background:var(--tinta);color:var(--bg)}
.mapwrap{background:var(--panel);border:1px solid var(--linea);border-radius:22px;padding:18px 18px 8px;position:relative}
.maplbl{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--gris);display:flex;justify-content:space-between;padding:0 6px}
svg.map{width:100%;height:auto;overflow:visible}
.map .lk{fill:none;stroke:var(--linea);stroke-width:2;transition:stroke .35s,stroke-width .35s,opacity .35s}
.map .lk.on{stroke:var(--acento);stroke-width:3}
.map.sel .lk:not(.on){opacity:.35}
.map .nd{cursor:pointer}
.map .nd circle{fill:var(--panel);stroke:var(--tinta);stroke-width:2;transition:fill .3s,stroke .3s,r .3s}
.map .nd text{font-family:var(--f);font-size:15px;font-weight:600;fill:var(--tinta);transition:fill .3s}
.map .nd.pj circle{fill:var(--suave);stroke:var(--gris)}
.map .nd.on circle{fill:var(--acento);stroke:var(--acento)}
.map .nd.pj.on text{fill:var(--acento)}
.map .nd:focus{outline:none}.map .nd:focus-visible circle{stroke-width:4}
.js .map .lk{stroke-dasharray:var(--len);stroke-dashoffset:var(--len)}
.js.ready .map .lk{stroke-dashoffset:0;transition:stroke-dashoffset 1.2s cubic-bezier(.6,0,.2,1) var(--d,0s),stroke .35s,stroke-width .35s,opacity .35s}
.chips{display:none;flex-wrap:wrap;gap:8px;margin-top:20px}
.chips button{background:var(--panel);border:1px solid var(--linea);border-radius:99px;padding:8px 14px;font-weight:600;font-size:14px}
.chips button[aria-pressed="true"]{background:var(--acento);color:#fff;border-color:var(--acento)}

/* ---------- ficha de la habilidad seleccionada ---------- */
.ficha{display:grid;grid-template-columns:1.1fr 1fr 1fr .9fr;gap:20px;background:var(--tinta);color:var(--bg);border-radius:22px;padding:26px 28px;margin-top:18px;min-height:150px}
.ficha h3{font-size:30px;font-weight:700;letter-spacing:-.03em;line-height:1}
.ficha h3 small{display:block;font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#a9a69e;margin-bottom:10px}
.ficha h4{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#a9a69e;font-weight:600;margin-bottom:6px}
.ficha p{font-size:15px}
.ficha .tools span{display:inline-block;font-size:13px;border:1px solid #4a4a4a;border-radius:99px;padding:3px 10px;margin:0 6px 6px 0}
.ficha a{color:#9fb0ff}
.ficha .cnt{font-size:56px;font-weight:700;letter-spacing:-.05em;line-height:1;color:#fff}
.ficha .cnt small{display:block;font-size:13px;font-weight:500;letter-spacing:0;color:#a9a69e;margin-top:6px}
.ficha.swap>*{animation:sw .45s cubic-bezier(.16,1,.3,1) both}
@keyframes sw{from{opacity:0;transform:translateY(8px)}}

/* ---------- cifras ---------- */
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:34px 0 10px}
.nums div{background:var(--panel);border:1px solid var(--linea);border-radius:18px;padding:18px 20px}
.nums strong{font-size:44px;font-weight:700;letter-spacing:-.05em;line-height:1;display:block}
.nums p{color:var(--gris);font-size:14px;margin-top:6px}

/* ---------- secciones ---------- */
section{padding:70px 0 10px;scroll-margin-top:70px}
.sh{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:26px;flex-wrap:wrap}
.sh h2{font-size:clamp(34px,4vw,56px);font-weight:700;letter-spacing:-.04em;line-height:1}
.sh p{color:var(--gris);max-width:440px}

/* ---------- sobre mí ---------- */
.about{display:grid;grid-template-columns:1fr 1.6fr;gap:clamp(20px,4vw,56px);align-items:start}
.about p{font-size:clamp(18px,1.6vw,22px);line-height:1.45}
.about p+p{margin-top:14px}
.about b{font-weight:600;color:var(--acento)}

/* ---------- proyectos ---------- */
.projs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.pc{background:var(--panel);border:1px solid var(--linea);border-radius:22px;padding:24px;display:flex;flex-direction:column;gap:14px;scroll-margin-top:80px;transition:transform .3s,border-color .3s}
.pc:hover,.pc:target{transform:translateY(-3px);border-color:var(--acento)}
.pc .n{font-size:13px;font-weight:600;color:var(--gris)}
.pc h3{font-size:24px;font-weight:700;letter-spacing:-.03em;line-height:1.05}
.pc .cli{font-size:14px;color:var(--gris);margin-top:-8px}
.pc .res{background:var(--suave);border-radius:14px;padding:14px 16px}
.pc .res strong{display:block;font-size:34px;font-weight:700;letter-spacing:-.04em;color:var(--acento);line-height:1.05}
.pc .res span{font-size:14px;color:var(--gris)}
.pc dl{font-size:15px;display:grid;gap:8px}
.pc dt{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--gris);font-weight:600}
.pc .tg{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}
.pc .tg button{font-size:12px;font-weight:600;border:1px solid var(--linea);background:var(--bg);border-radius:99px;padding:4px 10px}
.pc .tg button:hover{border-color:var(--acento);color:var(--acento)}

/* ---------- trayectoria ---------- */
.tl{display:grid;grid-template-columns:200px 1fr;gap:20px;padding:18px 0;border-top:1px solid var(--linea)}
.tl .w{font-weight:600;color:var(--gris)}
.tl h3{font-size:19px;font-weight:700}
.tl p{color:var(--gris)}

/* ---------- contacto y pie ---------- */
.contact{background:var(--acento);color:#fff;border-radius:28px;padding:clamp(30px,5vw,64px);margin:70px 0 30px;display:grid;grid-template-columns:1.4fr 1fr;gap:30px;align-items:end}
.contact h2{font-size:clamp(44px,6vw,90px);font-weight:700;letter-spacing:-.05em;line-height:.92}
.contact .l{display:grid;gap:10px}
.contact a,.contact button{display:flex;justify-content:space-between;align-items:center;gap:10px;text-decoration:none;font-weight:600;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);border-radius:14px;padding:14px 18px;color:#fff;font-size:15px;transition:background .25s;text-align:left;overflow-wrap:anywhere}
.contact a:hover,.contact button:hover{background:rgba(255,255,255,.22)}
.contact :focus-visible{outline-color:#fff}
footer{padding:10px 0 40px;color:var(--gris);font-size:13px}

/* ---------- responsive ---------- */
@media (max-width:960px){
  header.top nav{gap:14px;font-size:13px;overflow-x:auto;scrollbar-width:none}
  .hero{grid-template-columns:1fr}
  .mapwrap{display:none}
  .chips{display:flex}
  .ficha{grid-template-columns:1fr 1fr}
  .about{grid-template-columns:1fr}
  .projs{grid-template-columns:1fr}
  .tl{grid-template-columns:1fr;gap:4px}
  .contact{grid-template-columns:1fr}
  .nums{grid-template-columns:1fr 1fr 1fr;gap:8px}.nums div{padding:12px}.nums strong{font-size:30px}.nums p{font-size:12px}
}
@media (max-width:620px){header.top .id span{display:none}}
@media (max-width:520px){.ficha{grid-template-columns:1fr;padding:22px}}

/* ---------- base común ---------- */
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
img,svg{display:block;max-width:100%}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--acento);outline-offset:3px}
/* Movimiento: visible por defecto; el estado oculto solo aplica si cargó el JS */
.js .rv{opacity:0;transform:translateY(16px)}
.js .rv.in{opacity:1;transform:none;transition:opacity .7s ease,transform .8s cubic-bezier(.16,1,.3,1);transition-delay:var(--d,0s)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}.js .rv{opacity:1;transform:none}}
</style>
<script>document.documentElement.classList.add('js')</script>
</head>
<body>

<div class="wrap">

  <main>

  </main>
  <footer id="pie"></footer>
</div>

const habsDe = p => p.habilidades.filter(id => HAB[id]);
const REDUCE = matchMedia("(prefers-reduced-motion: reduce)").matches;
const cifraHTML = c => `<span data-v="${c.valor}" data-p="${esc(c.prefijo)}" data-s="${esc(c.sufijo)}">${esc(c.prefijo)}${c.valor}${esc(c.sufijo)}</span>`;

function countUp(el) {
  if (REDUCE || el.dataset.done) return; el.dataset.done = 1;
  const v = +el.dataset.v, p = el.dataset.p, s = el.dataset.s, t0 = performance.now(), d = 1300;
  const step = t => { const k = Math.min(1, (t - t0) / d), e = 1 - Math.pow(1 - k, 4); el.textContent = p + Math.round(v * e) + s; if (k < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
/* Aparición suave al hacer scroll (IntersectionObserver) */
function reveal(sel = ".rv") {
  const io = new IntersectionObserver(es => es.forEach(e => {
    if (!e.isIntersecting) return;
    e.target.classList.add("in"); io.unobserve(e.target);
    e.target.querySelectorAll("[data-v]").forEach(countUp);
  }), { rootMargin: "0px 0px -7% 0px", threshold: .06 });
  $$(sel).forEach(el => io.observe(el));
}
/* Empieza cuando las fuentes están listas (máx. 1,1 s): así la tipografía no "salta" */
function onReady(fn) {
  Promise.race([document.fonts ? document.fonts.ready : Promise.resolve(), new Promise(r => setTimeout(r, 1100))])
    .then(() => requestAnimationFrame(() => { document.documentElement.classList.add("ready"); fn && fn(); }));
}
function enlacesContacto() {
  const c = P.contacto;
  return [
    { k: "correo", t: c.correo, href: `mailto:${c.correo}` },
    c.linkedin && { k: "linkedin", t: "LinkedIn", href: c.linkedin },
    c.github && { k: "github", t: "GitHub", href: c.github }
  ].filter(Boolean);
}
function botonCopiar(el, etiqueta = "Copiar correo", ok = "¡Copiado!") {
  if (!el) return; el.textContent = etiqueta;
  el.addEventListener("click", () => navigator.clipboard?.writeText(P.contacto.correo).then(() => { el.textContent = ok; setTimeout(() => el.textContent = etiqueta, 1800); }));
}

/* =========================================================
   Renderizado
   ========================================================= */
$("#ini").textContent = P.iniciales; $("#nm").textContent = NOMBRE;
$("#estado").textContent = P.estado;
/* Foto: si carga, aparece en el inicio y reemplaza las iniciales de la barra */
if (P.foto) {
  const f = $("#foto");
  f.onload = () => {
    $("#fotobox").classList.add("ok"); f.alt = `Foto de ${NOMBRE}`;
    const mini = document.createElement("span"); mini.className = "mini";
    mini.innerHTML = `<img src="${esc(P.foto)}" alt="">`; $("#ini").replaceWith(mini);
  };
  f.src = P.foto;
}
$("#nombre").innerHTML = `${esc(P.nombre[0])} <span>${esc(P.nombre[1])}</span>`;
$("#rol").textContent = `${P.rol} · ${P.ciudad}`; $("#titular").innerHTML = P.titular;
$("#cifras").innerHTML = P.cifras.map(c => `<div class="rv"><strong>${cifraHTML(c)}</strong><p>${esc(c.texto)}</p></div>`).join("");
$("#sobre").innerHTML = P.sobre.map(t => `<p>${t}</p>`).join("");

/* --- mapa SVG: habilidades a la izquierda, proyectos a la derecha --- */
const H = P.habilidades, PR = P.proyectos, HH = 400;
const yS = i => 40 + i * ((HH - 80) / Math.max(1, H.length - 1));
const yP = i => PR.length === 1 ? HH / 2 : 70 + i * ((HH - 140) / Math.max(1, PR.length - 1));
const xs = 185, xp = 455;
let svg = "";
H.forEach((h, i) => pruebas(h).forEach(id => {
  const j = PR.findIndex(p => p.id === id), y1 = yS(i), y2 = yP(j);
  svg += `<path class="lk" data-h="${h.id}" data-p="${id}" style="--d:${(i * .08).toFixed(2)}s" d="M${xs} ${y1} C ${xs + 150} ${y1}, ${xp - 150} ${y2}, ${xp} ${y2}"/>`;
}));
H.forEach((h, i) => svg += `<g class="nd sk" data-h="${h.id}" tabindex="0" role="button" aria-label="${esc(h.nombre)}"><circle cx="${xs}" cy="${yS(i)}" r="9"/><text x="${xs - 20}" y="${yS(i) + 5}" text-anchor="end">${esc(h.nombre)}</text></g>`);
PR.forEach((p, j) => svg += `<g class="nd pj" data-p="${p.id}"><circle cx="${xp}" cy="${yP(j)}" r="11"/><text x="${xp + 22}" y="${yP(j) + 5}">${esc(p.titulo.length > 19 ? p.titulo.slice(0, 18) + "…" : p.titulo)}</text></g>`);
$("#map").innerHTML = svg;
$$("#map .lk").forEach(p => p.style.setProperty("--len", Math.ceil(p.getTotalLength())));
$("#chips").innerHTML = H.map(h => `<button type="button" data-h="${h.id}" aria-pressed="false">${esc(h.nombre)}</button>`).join("");

function sel(id, scroll) {
  const h = HAB[id]; if (!h) return;
  $("#map").classList.add("sel");
  $$("#map .lk").forEach(l => l.classList.toggle("on", l.dataset.h === id));
  $$("#map .nd.sk").forEach(n => n.classList.toggle("on", n.dataset.h === id));
  $$("#map .nd.pj").forEach(n => n.classList.toggle("on", h.proyectos.includes(n.dataset.p)));
  $$("#chips button").forEach(b => b.setAttribute("aria-pressed", b.dataset.h === id));
  const pr = pruebas(h), f = $("#ficha");
  f.classList.remove("swap"); void f.offsetWidth; f.classList.add("swap");
  f.innerHTML = `<div><h3><small>${esc(h.tipo)} · ${nn(h.n)}</small>${esc(h.nombre)}</h3></div>
    <div><h4>Lo que hago</h4><p>${esc(h.que)}</p></div>
    <div><h4>Cómo lo demostré</h4><p>${esc(h.prueba)}</p><p style="margin-top:6px">${pr.map(id => `<a href="#p-${id}">${esc(PROY[id].titulo)}</a>`).join(" · ")}</p></div>
    <div><div class="cnt">${pr.length}<small>${pr.length === 1 ? "proyecto lo prueba" : "proyectos lo prueban"}</small></div><div class="tools" style="margin-top:12px">${h.herramientas.map(t => `<span>${esc(t)}</span>`).join("")}</div></div>`;
  if (scroll) $("#inicio").scrollIntoView({ behavior: REDUCE ? "auto" : "smooth" });
}
$$("#map .nd.sk").forEach(n => { n.addEventListener("click", () => sel(n.dataset.h)); n.addEventListener("mouseenter", () => sel(n.dataset.h)); n.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); sel(n.dataset.h); } }); });
$$("#chips button").forEach(b => b.addEventListener("click", () => sel(b.dataset.h)));

$("#proy").innerHTML = PR.map((p, i) => `<article class="pc rv" style="--d:${(i % 2) * .06}s" id="p-${p.id}">
  <span class="n">Prueba ${nn(i + 1)}</span><h3>${p.enlace ? `<a href="${esc(p.enlace)}" target="_blank" rel="noopener">${esc(p.titulo)} ↗</a>` : esc(p.titulo)}</h3>
  <p class="cli">${esc(p.cliente)}</p>
  <div class="res"><strong>${esc(p.resultado.cifra)}</strong><span>${esc(p.resultado.texto)}</span></div>
  <dl><dt>Problema</dt><dd>${esc(p.problema)}</dd><dt>Lo que hice</dt><dd>${esc(p.accion)}</dd></dl>
  <div class="tg">${habsDe(p).map(id => `<button type="button" data-h="${id}">${esc(HAB[id].nombre)}</button>`).join("")}</div></article>`).join("");
$$(".pc .tg button").forEach(b => b.addEventListener("click", () => sel(b.dataset.h, true)));
$("#tray").innerHTML = P.trayectoria.map(t => `<div class="tl rv"><span class="w">${esc(t.cuando)}</span><div><h3>${esc(t.rol)}</h3><p>${esc(t.lugar)} · ${esc(t.detalle)}</p></div></div>`).join("");
$("#lnk").innerHTML = enlacesContacto().map(l => `<a href="${esc(l.href)}"${l.k !== "correo" ? ' target="_blank" rel="noopener"' : ""}><span>${esc(l.t)}</span><span aria-hidden="true">↗</span></a>`).join("") + `<button type="button" id="copy"></button>`;
botonCopiar($("#copy"));
$("#pie").textContent = `© ${new Date().getFullYear()} ${NOMBRE} · Hecho con apoyo de IA`;

/* Borde de la barra fija al hacer scroll */
addEventListener("scroll", () => $("#top").classList.toggle("scrolled", scrollY > 8), { passive: true });

sel(H[0].id);
onReady(() => reveal());
</script>
</body>
</html>
